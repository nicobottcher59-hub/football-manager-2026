name: Quality baseline

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install application and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check Python syntax
        run: python -m compileall -q src tests tools
      - name: Run complete Python regression suite
        run: python -m pytest -q -ra

  browser-script-tests:
    name: Browser JavaScript smoke tests / Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check plain JavaScript syntax
        run: find frontend -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Check tactical board behavior
        run: node tests/ui/test_board.cjs
